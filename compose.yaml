x-app: &app
  build: .
  working_dir: /app
  volumes:
    - .:/app

services:
  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CMS_PORT:-8093}:8093"
    environment:
      APP_URL: "http://localhost:${CMS_PORT:-8093}"
    command: ["php", "-d", "upload_max_filesize=5M", "-d", "post_max_size=8M", "artisan", "serve", "--host=0.0.0.0", "--port=8093"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel_admin}"
      MYSQL_USER: "${DB_USERNAME:-laravel_admin}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Cấu hình DB_PASSWORD trong .env}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1'
      interval: 3s
      timeout: 5s
      retries: 30

  app-test:
    <<: *app
    profiles: [test]
    depends_on:
      mysql-test:
        condition: service_healthy

  mysql-test:
    image: mysql:8.4
    profiles: [test]
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: webfx_test
      MYSQL_USER: webfx_test
      MYSQL_PASSWORD: webfx-test-only
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1'
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
